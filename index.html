<!DOCTYPE html>
<html>
<head>
<title>Risk Detection</title>
</head>
<body>
<h1>Risk Detection</h1>
<p>Objectif financier:</p>
<input id="o" type="number">
<p>Montant collecté:</p>
<input id="m" type="number">
<button onclick="test()">Analyser</button>
<p id="resultat"></p>
<script>
function test(){
let o=Number(document.getElementById("o").value);
let m=Number(document.getElementById("m").value);
let t=m/o*100;
let r=t>=100?"Risque faible":t>=70?"Risque moyen":"Risque élevé";
document.getElementById("resultat").innerHTML=t.toFixed(1)+"% - "+r;
}
</script>
</body>
</html>
