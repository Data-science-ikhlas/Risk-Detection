<!DOCTYPE html>
<html>
<head><title>CnBees</title>
<style>
body{font-family:Arial;background:#f4f5f9;margin:0;color:#17213b}header{background:#ffca36;padding:20px;text-align:center}main{max-width:850px;margin:25px auto;padding:15px}.card{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 3px 12px #ddd}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input{padding:12px;border:1px solid #ddd;border-radius:8px;width:85%}button{background:#ffbd25;border:0;padding:13px 25px;border-radius:9px;cursor:pointer;font-weight:bold}.result{background:#fff6dc;padding:15px;border-radius:12px}progress{width:100%}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>🐝 CnBees</h1><b>SMART RISK DETECTION</b><p>Monitor • Analyse • Réussissez</p></header>
<main><div class="card"><h2>📊 Votre campagne</h2><div class="grid">
<input id="o" type="number" placeholder="Objectif (DT)"><input id="m" type="number" placeholder="Montant collecté (DT)"><input id="d" type="number" placeholder="Durée totale"><input id="j" type="number" placeholder="Jours écoulés"></div><center><br><button onclick="go()">🔍 Analyser</button></center></div>
<div class="card"><h2>📈 Analyse des risques</h2><div class="grid" id="r"></div><div class="result" id="a">💡 Recommandation : En attente d'analyse</div></div></main>
<script>
function go(){
let o=+document.getElementById("o").value,m=+document.getElementById("m").value,d=+document.getElementById("d").value,j=+document.getElementById("j").value;
if(!document.getElementById("o").value||!document.getElementById("m").value||!document.getElementById("d").value||!document.getElementById("j").value||o<=0||m<0||d<=0||j<0||j>d)return alert("Vérifiez les données");
let p=m/o*100,v=m/Math.max(j,1),f=v*d,x=m/(o*j/d||1),risk=m>=o?"Atteint":x>=.9?"Faible":x>=.6?"Moyen":"Élevé",c=risk=="Élevé"?"Augmenter la publicité":risk=="Moyen"?"Attirer plus de contributeurs":"Continuer la stratégie";
document.getElementById("r").innerHTML=[["Progression",p.toFixed(1)+"%"],["Jours restants",d-j],["Moyenne / jour",v.toFixed(0)+" DT"],["Prévision finale",f.toFixed(0)+" DT"],["Niveau de risque",risk],["Alerte",risk=="Élevé"?"Campagne en difficulté":"Situation favorable"]].map(x=>"<div class='result'>"+x[0]+"<h2>"+x[1]+"</h2></div>").join("");
document.getElementById("a").innerHTML="💡 <b>Recommandation</b><p>"+c+"</p>";
}
</script></body></html>
