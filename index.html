<html>
<head><title>CnBees Monitor</title></head>
<body style="font-family:Arial;text-align:center;background:#fff8df;padding:20px">
<h1>🐝 CnBees Monitor</h1>
<h3>Campaign Performance</h3>
<input id="goal" type="number" placeholder="Funding goal (DT)"><br><br>
<input id="fund" type="number" placeholder="Collected amount (DT)"><br><br>
<input id="days" type="number" placeholder="Remaining days"><br><br>
<button onclick="check()">Check Campaign</button>
<div id="result"></div>
<script>
function check(){
let g=+document.getElementById("goal").value,f=+document.getElementById("fund").value,d=+document.getElementById("days").value;
if(g<=0||f<0||d<0||!document.getElementById("goal").value||!document.getElementById("fund").value||!document.getElementById("days").value){alert("Invalid data");return;}
let p=f/g*100,needed=(g-f)/Math.max(d,1),risk=p>=100?"Successful":p>=70?"Low Risk":p>=40?"Medium Risk":"High Risk";
let advice=risk=="Successful"?"Goal achieved!":risk=="Low Risk"?"Keep your campaign active":risk=="Medium Risk"?"Promote your campaign":"Increase marketing urgently";
document.getElementById("result").innerHTML="<h3>"+p.toFixed(1)+"% funded</h3>Remaining: "+(g-f).toFixed(0)+" DT<br>Needed per day: "+needed.toFixed(0)+" DT<br>Risk: "+risk+"<br>Advice: "+advice;
}
</script></body></html>
